[project]
name = "kiran-code"
version = "0.1.0"
description = "A minimal coding agent re-creation"
requires-python = ">=3.10"
dependencies = [
    "openai>=3.5.0",
    "prompt-toolkit>=3.0.53",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "kiran-code/agent",
    "kiran-code/context",
    "kiran-code/llm",
    "kiran-code/tools",
    "kiran-code/todos",
    "kiran-code/ui",
]
